<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회식 장소 찾기</title>
<link rel="stylesheet" href="/style.css">
<script src="/ui.js" defer></script>
</head>
<body>
<header class="hero"><div class="wrap mast"><div><h1>회식 장소 찾기</h1><p>근무지에서 자동차 30분, 역에서 도보 10분</p></div>
<label class="mode">검색 방식 <select id="mode"><option value="live">실데이터</option><option value="demo">데모 데이터</option></select></label></div></header>
<main class="wrap">
<form id="search" aria-label="회식 조건">
<div class="fields"><label>근무지<input id="work" required maxlength="150" placeholder="주소 또는 건물명"></label>
<label>희망 메뉴<input id="menus" required maxlength="164" placeholder="예: 삼겹살, 회"></label>
<label>인원<input id="people" required type="number" min="1" step="1" placeholder="예: 12"></label>
<button type="submit" id="submit">장소 찾기</button></div>
<fieldset><legend>역 유형</legend><label><input type="checkbox" name="station" value="KTX" checked> KTX</label><label><input type="checkbox" name="station" value="SRT" checked> SRT</label><label><input type="checkbox" name="station" value="metro" checked> 지하철</label></fieldset>
<details><summary>회식 일시와 추가 조건</summary>
<div class="extras"><label>회식 일시 (한국 시간)<input type="datetime-local" id="date"></label>
<label>1인 예산 (원)<input type="number" min="1" step="1" id="budget"></label>
<label>룸<select id="room"><option value="">선택 안 함</option><option value="prefer">선호</option><option value="required">필수</option></select></label>
<label>주차<select id="parking"><option value="">선택 안 함</option><option value="prefer">선호</option><option value="required">필수</option></select></label></div></details>
<div id="choices" hidden><label>근무지 주소 선택<select id="address"></select></label></div>
<p id="status" role="status" aria-live="polite"></p>
</form>
<div class="layout">
<section class="panel map-panel" aria-labelledby="mapHeading">
<div class="panel-top"><h2 id="mapHeading">네이버 지도</h2><div class="legend"><span>근무지</span><span>기준 통과 역</span><span>식당</span></div></div>
<div class="map-frame"><div id="map" aria-label="네이버 지도"></div><div id="mapMessage" role="status"><span>네이버 지도를 보려면 로컬 서버에서 페이지를 여세요. <a href="http://127.0.0.1:3000/">로컬 앱 열기</a></span></div></div>
</section>
<section class="panel results" aria-labelledby="resultsHeading">
<div class="panel-top"><h2 id="resultsHeading">검색 결과</h2><button id="copy" type="button" class="secondary" hidden>요약 복사</button></div>
<div class="result-body"><p id="notice">조건을 입력하면 추천 장소와 확인이 필요한 후보가 표시됩니다.</p>
<details id="issues" hidden><summary>일부 조회 실패</summary><ul></ul></details>
<div id="results"></div>
<textarea id="share" rows="5" readonly aria-label="공유용 요약" hidden></textarea></div>
</section>
</div>
</main>
</body>
</html>
